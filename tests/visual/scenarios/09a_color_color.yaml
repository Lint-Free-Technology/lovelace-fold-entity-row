id: color_color
description: Scenario with color set to various values
view_path: color-color

setup:
  - type: ha_service
    domain: switch
    service: turn_on
    data:
      entity_id: switch.decorative_lights

cards:
  - type: entities
    title: False color
    color: none
    entities:
      - switch.decorative_lights
      - type: custom:fold-entity-row
        open: true
        head: switch.decorative_lights
        entities:
          - switch.decorative_lights
  - type: entities
    title: State color
    color: state
    entities:
      - switch.decorative_lights
      - type: custom:fold-entity-row
        open: true
        head: switch.decorative_lights
        entities:
          - switch.decorative_lights
  - type: entities
    title: Group color
    entities:
      - switch.decorative_lights
      - type: custom:fold-entity-row
        open: true
        group_config:
          color: red
        head: switch.decorative_lights
        entities:
          - switch.decorative_lights

assertions:
  - type: object_property_text_equals
    root:
      - hui-grid-section
      - div.card:nth-of-type(1) hui-card hui-entities-card
      - fold-entity-row
    selector: div.container div hui-toggle-entity-row
    property: "_config.color"
    expected: "none"
  - type: object_property_text_equals
    root:
      - hui-grid-section
      - div.card:nth-of-type(2) hui-card hui-entities-card
      - fold-entity-row
    selector: div.container div hui-toggle-entity-row
    property: "_config.color"
    expected: "state"
  - type: object_property_text_equals
    root:
      - hui-grid-section
      - div.card:nth-of-type(3) hui-card hui-entities-card
      - fold-entity-row
    selector: div.container div hui-toggle-entity-row
    property: "_config.color"
    expected: "red"
  - type: snapshot
    name: "09a_color_color"
    threshold: 0.01